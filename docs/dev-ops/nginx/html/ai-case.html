<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 bg-gradient-to-br from-gray-100 via-slate-50 to-blue-50 h-screen text-gray-800 antialiased">
<div class="container mx-auto max-w-3xl h-screen h-[100dvh] flex flex-col px-3 py-3 sm:px-6 sm:py-6">
    <!-- Chat header -->
    <header class="flex items-center justify-between gap-3 pb-4 sm:pb-5">
        <div class="flex items-center gap-3 min-w-0">
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-blue-200 bg-white text-blue-500 shadow-sm" aria-hidden="true">
                <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>
                </svg>
            </div>
            <div class="min-w-0">
                <h1 class="text-lg font-semibold tracking-tight text-gray-900">AI Chat</h1>
                <p class="text-xs text-gray-500 sm:text-sm">A space for questions and ideas.</p>
            </div>
        </div>
        <span class="shrink-0 rounded-full border border-blue-100 bg-white px-3 py-1.5 text-xs font-medium text-blue-600 shadow-sm">AI Assistant</span>
    </header>

    <!-- Message container -->
    <div id="messageContainer" role="log" aria-label="Conversation" class="flex-1 min-h-0 overflow-y-auto overscroll-contain p-4 sm:p-6 space-y-5 bg-white rounded-2xl border border-gray-200 shadow-sm">
        <!-- Empty conversation guidance -->
        <div id="emptyState" class="flex h-full flex-col items-center justify-center px-3 pb-6 text-center">
            <div class="mb-5 flex h-16 w-16 items-center justify-center rounded-2xl border border-blue-100 bg-gradient-to-br from-blue-50 to-white text-blue-500 shadow-sm" aria-hidden="true">
                <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H5l-3 2v-9.5A8.5 8.5 0 0 1 10.5 4h2A8.5 8.5 0 0 1 21 11.5Z"/>
                    <path d="M8 12h.01M12 12h.01M16 12h.01"/>
                </svg>
            </div>
            <p class="mb-2 text-xl font-semibold tracking-tight text-gray-900 sm:text-2xl">What would you like to explore?</p>
            <p class="max-w-sm text-sm leading-6 text-gray-500">Ask a question, work through a problem, or try a new idea. Your answer will appear as it is generated.</p>
            <span class="mt-6 rounded-full border border-gray-100 bg-gray-50 px-3 py-1 text-xs text-gray-400">One question. New possibilities.</span>
        </div>
        <!-- Message history will be generated dynamically here -->
    </div>

    <!-- Input area -->
    <div class="p-3 sm:p-4 bg-white rounded-2xl border border-gray-200 shadow-sm mt-3 sm:mt-4 focus-within:border-blue-300 focus-within:ring-2 focus-within:ring-blue-100 transition-colors">
        <label for="messageInput" class="sr-only">Your message</label>
        <div class="flex items-center space-x-2">
            <input
                    type="text"
                    id="messageInput"
                    placeholder="Ask anything..."
                    autocomplete="off"
                    class="flex-1 min-w-0 p-2 sm:p-3 bg-transparent rounded-lg text-base placeholder:text-gray-400 focus:outline-none"
                    onkeypress="handleKeyPress(event)"
            >
            <button
                    type="button"
                    onclick="sendMessage()"
                    class="flex shrink-0 items-center gap-2 px-4 py-3 bg-blue-500 text-white text-sm font-medium rounded-xl hover:bg-blue-600 active:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 transition-colors"
            >
                Send
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m5 12 7-7 7 7M12 5v14"/>
                </svg>
            </button>
        </div>
    </div>
    <p class="pt-3 text-center text-xs leading-5 text-gray-400">Press Enter to send <span class="mx-1" aria-hidden="true">&middot;</span> AI responses may be inaccurate.</p>
</div>

<script>
    // Add a message to the container
    function addMessage(content, isUser = false) {
        const container = document.getElementById('messageContainer');
        const messageDiv = document.createElement('div');
        document.getElementById('emptyState').classList.add('hidden');

        messageDiv.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'}`;
        messageDiv.innerHTML = `
            <div class="max-w-[90%] sm:max-w-[85%] p-3 sm:p-4 rounded-2xl text-sm leading-7 break-words ${
            isUser ? 'bg-blue-500 text-white rounded-tr-md shadow-sm' : 'bg-gray-50 border border-gray-200 text-gray-800 rounded-tl-md'
        }">
                ${content}
            </div>
        `;

        const label = document.createElement('span');
        label.className = 'mb-1 px-1 text-xs font-medium text-gray-400';
        label.textContent = isUser ? 'You' : 'AI';
        const messageGroup = document.createElement('section');
        messageGroup.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'}`;
        messageGroup.appendChild(label);
        messageGroup.appendChild(messageDiv);
        container.appendChild(messageGroup);
        container.scrollTop = container.scrollHeight; // Scroll to the bottom
    }

    // Send a message
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();

        if (!message) return;

        // Clear the input field
        input.value = '';

        // Add the user's message
        addMessage(message, true);

        // Add an initial AI message placeholder
        addMessage('<span class="animate-pulse">▍</span>');

        // Build the API URL
        const apiUrl = `http://localhost:8090/api/v1/ollama/generate_stream?model=deepseek-r1:1.5b&message=${encodeURIComponent(message)}`;

        // Receive streaming responses using EventSource
        const eventSource = new EventSource(apiUrl);
        let buffer = '';

        eventSource.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                const content = data.result?.output?.content || '';
                const finishReason = data.result?.metadata?.finishReason;

                if (content) {
                    buffer += content;
                    updateLastMessage(buffer + '<span class="animate-pulse">▍</span>');
                }

                if (finishReason === 'STOP') {
                    eventSource.close();
                    updateLastMessage(buffer); // Remove the loading animation
                }
            } catch (error) {
                console.error('Parsing error:', error);
            }
        };

        eventSource.onerror = (error) => {
            console.error('EventSource error:', error);
            eventSource.close();
        };
    }

    // Update the last message
    function updateLastMessage(content) {
        const container = document.getElementById('messageContainer');
        const lastMessage = container.lastChild.querySelector('div > div');
        lastMessage.innerHTML = content;
        container.scrollTop = container.scrollHeight;
    }

    // Send on Enter
    function handleKeyPress(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }
</script>
</body>
</html>
